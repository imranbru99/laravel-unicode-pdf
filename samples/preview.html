<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sample preview</title>
  <style>
    body { margin: 0; background: #444; }
    canvas { display: block; margin: 8px auto; background: #fff; }
  </style>
</head>
<body>
<canvas id="page"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const file = params.get('file') || '07-all-language-story.pdf';
  const pageNum = parseInt(params.get('page') || '1', 10);
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfjsLib.getDocument(file).promise.then(async (pdf) => {
    const page = await pdf.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1.45 });
    const canvas = document.getElementById('page');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    document.title = 'rendered:' + pageNum + '/' + pdf.numPages;
  }).catch((err) => {
    document.title = 'error';
    document.body.innerText = String(err);
  });
</script>
</body>
</html>
